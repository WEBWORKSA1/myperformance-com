<section class="tight"><div class="wrap narrow" style="margin:0 auto">
  <h1>Search</h1>
  <input data-search placeholder="Search tools, templates and guides…" autofocus aria-label="Search" style="font-size:1.1rem;padding:16px">
  <div data-search-results style="margin-top:20px"></div>
  <div class="ad-slot leader" data-slot="search">Advertisement</div>
</div></section>
<script>(function(){var q=new URLSearchParams(location.search).get('q');if(q){var i=document.querySelector('[data-search]');i.value=q;setTimeout(function(){i.dispatchEvent(new Event('input'))},50)}})();</script>
